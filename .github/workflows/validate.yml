name: validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Validate skills and evaluations
        run: pnpm run validate

      - name: Check links
        run: pnpm run check-links

      - name: Catalog in sync
        run: pnpm run catalog:check

      - name: Unit tests
        run: pnpm test

      - name: Build zips (dry-run)
        run: pnpm run build:zips
