name: publish-release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Validate
        run: pnpm run validate

      - name: Check links
        run: pnpm run check-links

      - name: Catalog in sync
        run: pnpm run catalog:check

      - name: Unit tests
        run: pnpm test

      - name: Build zips
        run: pnpm run build:zips

      - name: Create GitHub Release with zip assets
        uses: softprops/action-gh-release@v2
        with:
          files: skills/*.zip
          generate_release_notes: true
