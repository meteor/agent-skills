name: publish-release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        run: pnpm audit --audit-level moderate

      - name: Check plugin version
        run: node .github/skills/release-publishing/scripts/plugin-version.mjs --check "${GITHUB_REF_NAME}"

      - name: Validate
        run: pnpm run validate

      - name: Check links
        run: pnpm run check-links

      - name: Catalog in sync
        run: pnpm run catalog:check

      - name: Unit tests
        run: pnpm test

      - name: Build zips
        run: pnpm run build:zips

      - name: Create GitHub Release with zip assets
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: skills/*.zip
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
